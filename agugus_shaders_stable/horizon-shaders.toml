schema = 1
id = "agugus_shaders_stable"
name = "Agugus Shaders (Stable)"
version = "1.0.0"
api = "0.1"
description = "Soft pastel light, bloom and a gentle grade. A native Horizon shader pack for shader API 0.1, for Horizon stable releases (v0.2.97 and its line) that predate shader API 0.2. The shader API 0.2 edition of Agugus Shaders has the stages this line lacks."
authors = ["Agugus"]

shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"

[material]
file = "material.wgsl"

[[post]]
file = "atmosphere.wgsl"
name = "Atmosphere"

[[post]]
file = "godrays.wgsl"
name = "Godrays"

[[post]]
file = "ssao.wgsl"
name = "SSAO"

[[post]]
file = "bloom.wgsl"
name = "Bloom"

[[post]]
file = "final.wgsl"
name = "Grade"

[[options]]
id = "color_scheme"
name = "Colour scheme"
type = "choice"
values = ["Default", "Vanilla", "Choc v7", "Visually Vibrant"]
default = "Default"

[[options]]
id = "tonemap_operator"
name = "Tonemap operator"
type = "choice"
values = ["ACES Film", "Reinhard-Jodie", "ACES Slow", "Hejl 2015"]
default = "ACES Film"

